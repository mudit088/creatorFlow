name: creatorflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: cf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creatorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-creatorflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creatorflow} -d ${POSTGRES_DB:-creatorflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cf_redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cf_minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cf_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-creatorflow-dev};
      mc anonymous set none local/${S3_BUCKET:-creatorflow-dev};
      echo 'bucket ready';
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: cf_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-creatorflow}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-creatorflow}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cf_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
      API_INTERNAL_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
  miniodata: